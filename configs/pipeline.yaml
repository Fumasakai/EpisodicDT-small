simulation_config: configs/training_dataset_v2.yaml
data:
  train_path: data/processed/training_dataset_next/episodes/train
  validation_path: data/processed/training_dataset_next/episodes/validation
  evaluation_path: data/processed/training_dataset_next/episodes/evaluation
output_dir: data/processed/training_dataset_next/mobility
diffusion_output_dir: data/processed/training_dataset_next/diffusion
seed: 42
warmup_s: 3.0
events:
- ho_failure
- pingpong
reward_mode: any_danger
ue_attributes:
  car:
    min_moving_speed_mps: 1.0
    max_speed_mps: 65.0
    allow_stop: true
  walker:
    min_moving_speed_mps: 0.3
    max_speed_mps: 2.0
    allow_stop: true
  static:
    min_moving_speed_mps: 0.0
    max_speed_mps: 0.0
    allow_stop: true
model:
  hidden_dim: 32
  latent_dim: 96
  num_heads: 4
  num_layers: 1
  waypoint_interval_s: 0.5
  action_std: 0.35
  bounds:
  - - -100
    - 1100
  - - -200
    - 200
training:
  simulation_workers: 8
  updates: 200
  episodes_per_update: 2
  samples_per_episode: 4
  learning_rate: 0.0001
  latent_l2: 0.0001
  runs:
  - 1
  validation_runs:
  - 101
  - 102
  validation_every: 20
  validation_episodes: 8
  early_stopping:
    patience: 2
    min_delta: 0.0
diffusion:
  epochs: 600
  batch_size: 32
  learning_rate: 0.001
  hidden_dim: 128
  steps: 100
  feedback_rounds: 5
  candidates_per_round: 24
  feedback_updates: 100
  reward_temperature: 0.5
  anchor_weight: 1.0
  runs:
  - 1
  sampling_start: positive
  noise_fraction: 0.15
